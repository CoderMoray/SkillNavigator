[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillnav"
# Single version source: skillnav/__init__.py `__version__` (read by
# setuptools via the dynamic attr below, so pyproject and the package can
# never drift apart). Bump it there, commit on main, then push the tag.
dynamic = ["version"]
description = "CLI client for the Skill management platform (SkillNavigator)"
readme = "README.md"
# 3.10 是真实下界：3.9 上 pip 只能装到 click 8.1.x，而 CLI 在该组合下会把
# 合法调用判为用法错误（例如 `--json update` 退出码 2），所以 3.9 是"能装上、
# 不能用"。与其留一个名不副实的声明，不如把下界写到可用版本。
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["skill", "cli", "agent", "registry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    # 0.16 是实测的最低可用版本：0.12（48 个测试失败）与 0.14（help 渲染不符）
    # 都过不了测试套件。pip 正常安装总是取最新版，这个下界只影响被钉住旧版本的
    # 环境 —— 与其写一个跑不起来的 `>=0.12`，不如把真实下界写清楚。
    "typer>=0.16",
    # cli.py imports click directly (SkillnavGroup / UsageError). It used to be
    # pulled in transitively via typer, but Typer 0.24+ vendors its own click
    # fork and no longer depends on the top-level package: without this line a
    # fresh install dies with "No module named 'click'".
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.10",
]

[project.scripts]
skillnav = "skillnav.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# 默认集（F 全部 + E4/E7/E9）；后续需要可扩展（I/UP/B 等）。
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = false
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "skillnav.__version__" }
