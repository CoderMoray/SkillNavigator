<!-- MonoSkillNavigator · Style B — Obsidian Signal -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<title>${subject}</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #e8edf3;
        color: #18212f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    table {
        border-collapse: collapse;
    }
    img {
        border: 0;
        display: block;
        outline: none;
        text-decoration: none;
    }
    .email-shell {
        width: 620px;
        max-width: 620px;
    }
    .card {
        overflow: hidden;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 16px 44px rgba(15, 23, 42, 0.13);
    }
    .hero {
        padding: 30px 38px 28px;
        background: #101827;
        background: linear-gradient(135deg, #0b1220 0%, #121b2c 52%, #1b2940 100%);
    }
    .brand-label {
        margin: 0;
        color: #9eb6d8;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.7px;
        line-height: 14px;
        text-transform: uppercase;
    }
    .hero-subject {
        margin: 13px 0 0;
        color: #f8fafc;
        font-size: 23px;
        font-weight: 650;
        letter-spacing: -0.45px;
        line-height: 31px;
    }
    .signal {
        width: 42px;
        height: 2px;
        margin-top: 19px;
        border-radius: 2px;
        background: #59b7ff;
        background: linear-gradient(90deg, #60a5fa 0%, #5eead4 100%);
        font-size: 2px;
        line-height: 2px;
    }
    .content-padding {
        padding: 34px 38px 30px;
    }
    .content {
        color: #374151;
        font-size: 15px;
        line-height: 25px;
    }
    .content p {
        margin: 0 0 16px;
    }
    .content a {
        color: #2563eb;
        text-decoration: underline;
        text-underline-offset: 2px;
    }
    .note {
        margin: 20px 0;
        padding: 14px 16px;
        border-left: 3px solid #c98727;
        border-radius: 0 8px 8px 0;
        background-color: #fff8e8;
        color: #544229;
        font-size: 14px;
        line-height: 22px;
    }
    .comment {
        margin-top: 20px;
        padding: 14px 16px;
        border-radius: 9px;
        background-color: #f5f7fa;
        color: #64748b;
        font-size: 12px;
        line-height: 19px;
    }
    .signature {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid #e6ebf1;
        color: #334155;
        font-size: 12px;
        line-height: 19px;
    }
    .signature-desc {
        margin: 6px 0 4px;
        color: #64748b;
        font-size: 10px;
        line-height: 15px;
    }
    .signature-email {
        margin-top: 2px;
        color: #64748b;
        font-size: 11px;
        line-height: 16px;
    }
    .assurance {
        margin: 15px 0 0;
        color: #2563eb;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.1px;
        line-height: 14px;
    }
    .signature-logo {
        width: 92px;
        height: auto;
        opacity: 0.42;
    }
    @media only screen and (max-width: 640px) {
        .email-shell {
            width: 100% !important;
        }
        .page-padding {
            padding: 18px 12px !important;
        }
        .hero,
        .content-padding {
            padding-left: 24px !important;
            padding-right: 24px !important;
        }
        .hero-subject {
            font-size: 22px !important;
            line-height: 30px !important;
        }
        .signature-logo {
            width: 74px !important;
        }
    }
</style>
</head>
<body>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background-color:#e8edf3;">
    <tr>
        <td class="page-padding" align="center" style="padding:32px 16px;">
            <table class="email-shell" role="presentation" width="620" cellpadding="0" cellspacing="0" border="0" style="width:620px; max-width:620px;">
                <tr>
                    <td class="card" style="overflow:hidden; border-radius:14px; background:#ffffff;">
                        <div class="hero" style="padding:30px 38px 28px; background:#101827;">
                            <p class="brand-label" style="margin:0; color:#9eb6d8; font-size:10px; font-weight:700; letter-spacing:1.7px; line-height:14px; text-transform:uppercase;">${brand_name} · PLATFORM NOTICE</p>
                            <h1 class="hero-subject" style="margin:13px 0 0; color:#f8fafc; font-size:23px; font-weight:650; letter-spacing:-0.45px; line-height:31px;">${subject}</h1>
                            <div class="signal" style="width:42px; height:2px; margin-top:19px; border-radius:2px; background:#59b7ff; font-size:2px; line-height:2px;">&nbsp;</div>
                        </div>
                        <div class="content-padding" style="padding:34px 38px 30px;">
                            <div class="content" style="color:#374151; font-size:15px; line-height:25px;">
                                <p>${name}您好:</p>
                                <p>${main_content}</p>
                                ${note}
                                ${end_content}
                                ${comment}
                            </div>

                            <table class="signature" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; margin-top:28px; padding-top:24px; border-top:1px solid #e6ebf1; color:#334155; font-size:12px; line-height:19px;">
                                <tr>
                                    <td valign="bottom" style="padding:0;">
                                        Best Regards,<br>
                                        ${signature_name}<br>
                                        ${signature_email}
                                        <div class="signature-desc">${brand_name} · Agent Skill 注册与审查平台</div>
                                        <div class="signature-email">Support by APPLE, China | ${brand_name} Team</div>
                                        <p class="assurance">SECURE · REVIEWED · TRUSTED</p>
                                    </td>
                                    <td width="100" valign="bottom" align="right" style="width:100px; padding:0 0 0 16px;">
                                        <img
                                            class="signature-logo"
                                            src="data:image/png;base64,${logo_base64}"
                                            alt="${brand_name} Logo"
                                            width="92"
                                        >
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
